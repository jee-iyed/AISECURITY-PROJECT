name: CI

on:
  push:
    branches: [main, codex/ai-security-gateway]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Ruff + pytest, Gemini mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests never call Gemini: conftest forces demo mode and mocks the client.
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.1
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest -q
      - name: Benchmark (detection only, offline)
        run: python -m benchmark.run --no-e2e --out ../work/bench-ci

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  secrets:
    name: Secret scan (Gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --no-banner --exit-code 1
          --gitleaks-ignore-path /repo/.gitleaksignore

  dependency-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    # Advisories in pinned upstream packages are reported, not blocking:
    # they need a reviewed upgrade rather than an automatic failure.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
